name: Validate deterministic control contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated framework enums
        run: python scripts/generate_enums.py --check
      - name: Validate contract, actual rules and specification links
        run: python scripts/validate_contract.py
      - name: Run deterministic engine and registry tests
        run: python -m unittest discover -s tests -v
