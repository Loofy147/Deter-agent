name: Validate deterministic control contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-contract:
    name: Contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify generated framework enums
        run: python scripts/generate_enums.py --check
      - name: Validate contract, actual rules and specification links
        run: python scripts/validate_contract.py
      - name: Run deterministic engine and registry tests
        run: python -m unittest discover -s tests -v
